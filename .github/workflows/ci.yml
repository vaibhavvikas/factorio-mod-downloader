name: Factorio Mod Downloader CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'apps/gui/package-lock.json'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        working-directory: apps/gui
        run: npm ci

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Build Standalone Desktop GUI Executable
        working-directory: apps/gui
        run: |
          npm run build
          npx tauri build --no-bundle

      - name: Stage Standalone Executable Artifact
        shell: bash
        run: |
          mkdir -p dist_executable
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/app.exe dist_executable/factorio-mod-downloader-gui-windows-x64.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp target/release/app dist_executable/factorio-mod-downloader-gui-macos-x64
          else
            cp target/release/app dist_executable/factorio-mod-downloader-gui-linux-x64
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: factorio-mod-downloader-pr-${{ github.event.pull_request.number }}-gui-${{ matrix.os }}
          path: dist_executable/
          retention-days: 3
          overwrite: true

  pr-comment:
    name: Update PR Comment
    needs: build-and-test
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Generate Direct Artifact Links
        id: links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACTS=$(gh api /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)

          WIN_ID=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | contains("windows")) | .id')
          MAC_ID=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | contains("macos")) | .id')
          LIN_ID=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | contains("ubuntu")) | .id')

          BASE_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"

          echo "WINDOWS_URL=$BASE_URL/$WIN_ID" >> $GITHUB_OUTPUT
          echo "MACOS_URL=$BASE_URL/$MAC_ID" >> $GITHUB_OUTPUT
          echo "LINUX_URL=$BASE_URL/$LIN_ID" >> $GITHUB_OUTPUT

      - name: Post Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: build-artifacts
          message: |
            ### 🚀 Build Artifacts are Ready!
            The desktop standalone executables have been successfully compiled for this pull request.

            👉 **Direct Executable Artifacts:**
            * [🪟 Windows (.exe standalone)](${{ steps.links.outputs.WINDOWS_URL }})
            * [🍎 macOS (Standalone Executable)](${{ steps.links.outputs.MACOS_URL }})
            * [🐧 Linux (Standalone Executable)](${{ steps.links.outputs.LINUX_URL }})

            *Note: You must be logged into GitHub to download artifacts.*
