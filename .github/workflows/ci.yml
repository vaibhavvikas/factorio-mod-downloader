name: CI Test Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      # 1. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          
      # 2. Setup Rust
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        
      # 3. Install Linux System Dependencies (Crucial for Ubuntu runners)
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # 4. Install Frontend Dependencies
      - name: Install Dependencies
        run: npm install # or pnpm install / bun install depending on your setup
        
      # 5. Run Tests (Compiles Rust crates)
      - name: Run Tests
        run: cargo test
        
      # 6. Build App (Reuses compiled crates from tests)
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Note: By omitting `tagName` or `releaseId`, the action will simply build the app and NOT attempt to create a GitHub release.
        
      # 7. Upload Artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: factorio-mod-downloader-pr-${{ github.event.pull_request.number }}-gui-${{ matrix.os }}
          # Point directly to the Tauri bundle output directory
          path: src-tauri/target/release/bundle/
          retention-days: 3
          overwrite: true

  pr-comment:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Generate Direct Artifact Links
        id: links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACTS=$(gh api /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
          
          WIN_ID=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | contains("windows")) | .id')
          MAC_ID=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | contains("macos")) | .id')
          LIN_ID=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | contains("ubuntu")) | .id')
          
          BASE_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          
          # WRITE TO GITHUB_OUTPUT INSTEAD OF GITHUB_ENV
          echo "WINDOWS_URL=$BASE_URL/$WIN_ID" >> $GITHUB_OUTPUT
          echo "MACOS_URL=$BASE_URL/$MAC_ID" >> $GITHUB_OUTPUT
          echo "LINUX_URL=$BASE_URL/$LIN_ID" >> $GITHUB_OUTPUT

      - name: Update PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: build-artifacts
          message: |
            ### 🚀 Build Artifacts are Ready!
            The desktop executables have been successfully compiled for this pull request.
            
            👉 **Direct Download Links:**
            * [🪟 Windows (.exe / .msi)](${{ steps.links.outputs.WINDOWS_URL }})
            * [🍎 macOS (.app / .dmg)](${{ steps.links.outputs.MACOS_URL }})
            * [🐧 Linux (.deb / AppImage)](${{ steps.links.outputs.LINUX_URL }})
            
            *Note: You must be logged into GitHub to download artifacts.*