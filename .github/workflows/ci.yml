name: Factorio Mod Downloader CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'apps/gui/package-lock.json'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        working-directory: apps/gui
        run: npm ci

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Build Desktop GUI Executable
        working-directory: apps/gui
        shell: bash
        run: |
          npm run build
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npx tauri build
          else
            npx tauri build --no-bundle
          fi

      - name: Stage Standalone Executable Artifact
        shell: bash
        run: |
          mkdir -p dist_executable
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            EXE_FILE=""
            for candidate in \
              "target/release/gui.exe" \
              "target/release/Factorio Mod Downloader.exe" \
              "target/release/factorio-mod-downloader.exe" \
              "target/release/factorio-mod-downloader-gui.exe" \
              "target/release/gui-v2.exe" \
              "target/release/app.exe" \
              "apps/gui/src-tauri/target/release/gui.exe" \
              "apps/gui/src-tauri/target/release/Factorio Mod Downloader.exe"
            do
              if [ -f "$candidate" ]; then
                EXE_FILE="$candidate"
                break
              fi
            done

            if [ -z "$EXE_FILE" ]; then
              EXE_FILE=$(find target -maxdepth 3 -type f -name "*.exe" ! -name "*cli*" ! -name "build*" ! -path "*/deps/*" 2>/dev/null | head -n 1)
            fi

            if [ -z "$EXE_FILE" ] || [ ! -f "$EXE_FILE" ]; then
              echo "Error: Windows GUI executable not found in target/release/"
              ls -la target/release/ 2>/dev/null || true
              exit 1
            fi
            echo "Staging Windows executable: $EXE_FILE"
            cp "$EXE_FILE" dist_executable/factorio-mod-downloader-gui-windows-x64.exe

          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            APP_DIR=""
            for candidate in \
              "target/release/bundle/macos/Factorio Mod Downloader.app" \
              "target/universal-apple-darwin/release/bundle/macos/Factorio Mod Downloader.app" \
              "apps/gui/src-tauri/target/release/bundle/macos/Factorio Mod Downloader.app"
            do
              if [ -d "$candidate" ]; then
                APP_DIR="$candidate"
                break
              fi
            done

            if [ -z "$APP_DIR" ]; then
              APP_DIR=$(find target -type d -name "*.app" 2>/dev/null | head -n 1)
            fi

            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              echo "Error: macOS app bundle not found in target/release/bundle/macos/"
              ls -la target/release/bundle/macos/ 2>/dev/null || true
              exit 1
            fi
            echo "Staging macOS app bundle: $APP_DIR"
            APP_DIR_ABS="$(cd "$APP_DIR" && pwd)"
            APP_PARENT_DIR="$(dirname "$APP_DIR_ABS")"
            APP_BASE_NAME="$(basename "$APP_DIR_ABS")"
            (cd "$APP_PARENT_DIR" && zip -r "${GITHUB_WORKSPACE}/dist_executable/factorio-mod-downloader-gui-macos-x64.app.zip" "$APP_BASE_NAME")

          else
            BIN_FILE=""
            for candidate in \
              "target/release/gui" \
              "target/release/Factorio Mod Downloader" \
              "target/release/factorio-mod-downloader" \
              "target/release/factorio-mod-downloader-gui" \
              "target/release/gui-v2" \
              "target/release/app" \
              "apps/gui/src-tauri/target/release/gui" \
              "apps/gui/src-tauri/target/release/Factorio Mod Downloader"
            do
              if [ -f "$candidate" ] && [ ! -d "$candidate" ]; then
                BIN_FILE="$candidate"
                break
              fi
            done

            if [ -z "$BIN_FILE" ]; then
              BIN_FILE=$(find target -maxdepth 3 -type f -executable ! -name "*.d" ! -name "*.so*" ! -name "*cli*" ! -name "build*" ! -path "*/deps/*" 2>/dev/null | head -n 1)
            fi

            if [ -z "$BIN_FILE" ] || [ ! -f "$BIN_FILE" ]; then
              echo "Error: Linux GUI executable not found in target/release/"
              ls -la target/release/ 2>/dev/null || true
              exit 1
            fi
            echo "Staging Linux executable: $BIN_FILE"
            chmod +x "$BIN_FILE"
            cp "$BIN_FILE" dist_executable/factorio-mod-downloader-gui-linux-x64
            cd dist_executable
            tar -czvf factorio-mod-downloader-gui-linux-x64.tar.gz factorio-mod-downloader-gui-linux-x64
            rm factorio-mod-downloader-gui-linux-x64
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: factorio-mod-downloader-pr-${{ github.event.pull_request.number }}-gui-${{ matrix.os }}
          path: dist_executable/
          retention-days: 3
          overwrite: true

  pr-comment:
    name: Update PR Comment
    needs: build-and-test
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Generate Direct Artifact Links
        id: links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACTS=$(gh api /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)

          WIN_ID=$(echo "$ARTIFACTS" | jq -r '[.artifacts[] | select(.name | contains("windows"))][0].id // empty')
          MAC_ID=$(echo "$ARTIFACTS" | jq -r '[.artifacts[] | select(.name | contains("macos"))][0].id // empty')
          LIN_ID=$(echo "$ARTIFACTS" | jq -r '[.artifacts[] | select(.name | contains("ubuntu"))][0].id // empty')

          BASE_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"

          echo "WINDOWS_URL=$BASE_URL/$WIN_ID" >> $GITHUB_OUTPUT
          echo "MACOS_URL=$BASE_URL/$MAC_ID" >> $GITHUB_OUTPUT
          echo "LINUX_URL=$BASE_URL/$LIN_ID" >> $GITHUB_OUTPUT

      - name: Post Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: build-artifacts
          message: |
            ### 🚀 Build Artifacts are Ready!
            The desktop standalone executables have been successfully compiled for this pull request.

            👉 **Direct Executable Artifacts:**
            * [🪟 Windows (.exe standalone)](${{ steps.links.outputs.WINDOWS_URL }})
            * [🍎 macOS (.app.zip bundle)](${{ steps.links.outputs.MACOS_URL }})
            * [🐧 Linux (.tar.gz standalone)](${{ steps.links.outputs.LINUX_URL }})

            *Note: You must be logged into GitHub to download artifacts.*
