name: CI Test Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Fast Validation & Unit Tests
  # ==========================================
  test:
    name: Test & Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'apps/gui/ui/package-lock.json'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run Cargo Workspace Checks & Unit Tests
        run: |
          cargo check --workspace
          cargo test --workspace

      - name: Install Frontend Dependencies
        working-directory: apps/gui/ui
        run: npm ci

      - name: Validate Frontend TypeScript Build
        working-directory: apps/gui/ui
        run: npm run build

  # ==========================================
  # JOB 2: Desktop Binary Build & Artifact Upload
  # ==========================================
  build:
    name: Build & Artifact (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'apps/gui/ui/package-lock.json'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        working-directory: apps/gui/ui
        run: npm ci

      - name: Build Tauri Desktop App
        working-directory: apps/gui/ui
        run: npx tauri build --no-bundle

      - name: Collect Executable Artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pr-artifacts
          RELEASE_DIR="target/release"

          if [ "${{ runner.os }}" = "Windows" ]; then
            SRC="$RELEASE_DIR/app.exe"
            DEST="pr-artifacts/factorio-mod-downloader-windows-x64.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            SRC="$RELEASE_DIR/app"
            DEST="pr-artifacts/factorio-mod-downloader-macos"
          else
            SRC="$RELEASE_DIR/app"
            DEST="pr-artifacts/factorio-mod-downloader-linux-x64"
          fi

          if [ ! -f "$SRC" ]; then
            echo "Executable not found at $SRC"
            find "$RELEASE_DIR" -maxdepth 2 -type f 2>/dev/null | head -100 || true
            exit 1
          fi

          cp -f "$SRC" "$DEST"
          chmod +x "$DEST" || true
          ls -lah pr-artifacts

      - name: Upload PR Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: factorio-mod-downloader-pr-${{ github.event.pull_request.number }}-gui-${{ matrix.os }}
          path: pr-artifacts/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 6

  # ==========================================
  # JOB 3: Pull Request Comment
  # ==========================================
  pr-comment:
    name: Link Artifacts in PR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add Sticky PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: build-artifacts
          message: |
            ### 🚀 Build Artifacts are Ready!
            
            The desktop executables for Windows, macOS, and Linux have been successfully compiled for this pull request.
            
            👉 **[Click here to view and download the artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**
            
            *Note: Scroll to the "Artifacts" section at the bottom of the linked workflow page to download the files. You must be logged into GitHub to download artifacts.*