name: Release Build & Publish

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.3.1 or 0.3.1)'
        required: true
      overwrite_release:
        description: 'Overwrite existing GitHub release tag if re-run'
        type: boolean
        required: false
        default: true

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.version || 'auto' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Release Branch & Version
    runs-on: ubuntu-latest
    outputs:
      target_version: ${{ steps.resolve.outputs.target_version }}
      raw_version: ${{ steps.resolve.outputs.raw_version }}
    steps:
      - name: Resolve and validate release version
        id: resolve
        shell: bash
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [[ "$BRANCH" != release/* ]]; then
              echo "::error::Manual releases must be triggered from a release/* branch. Current branch: $BRANCH"
              exit 1
            fi

            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "::error::Release version input is required for manual runs."
              exit 1
            fi
          else
            if [[ "$BRANCH" != release/* ]]; then
              echo "::error::Automatic releases must run from a release/* branch. Current branch: $BRANCH"
              exit 1
            fi
            VERSION="${BRANCH#release/}"
          fi

          if [[ "$VERSION" != v* ]]; then
            VERSION="v$VERSION"
          fi

          RAW_VERSION="${VERSION#v}"
          if ! [[ "$RAW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid semver version: $VERSION"
            exit 1
          fi

          if [ "$BRANCH" != "release/$VERSION" ] && [ "$BRANCH" != "release/$RAW_VERSION" ]; then
            echo "::error::Branch name must match the release version. Expected: release/$VERSION or release/$RAW_VERSION, got: $BRANCH"
            exit 1
          fi

          echo "target_version=$VERSION" >> $GITHUB_OUTPUT
          echo "raw_version=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "Validated release $VERSION on branch $BRANCH"

  test:
    name: Test (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'apps/gui/package-lock.json'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        working-directory: apps/gui
        run: npm ci

      - name: Run Workspace Tests
        run: cargo test --workspace

  cleanup-existing-release:
    name: Cleanup Existing Release
    needs: [validate, test]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete Existing Release Tag (If Overwrite Selected)
        if: ${{ github.event.inputs.overwrite_release != 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ needs.validate.outputs.target_version }}
        run: |
          gh release delete "$TARGET_VERSION" --yes --cleanup-tag || true

  build-and-release:
    name: Build & Publish (${{ matrix.platform }})
    needs: [validate, cleanup-existing-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync App Version Files
        shell: bash
        env:
          RAW_VERSION: ${{ needs.validate.outputs.raw_version }}
        run: |
          echo "Propagating version $RAW_VERSION into config files..."
          node -e "
            const fs = require('fs');

            // apps/gui/package.json
            const pkgPath = 'apps/gui/package.json';
            if (fs.existsSync(pkgPath)) {
              const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
              pkg.version = process.env.RAW_VERSION;
              fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
            }

            // apps/gui/src-tauri/tauri.conf.json
            const tauriPath = 'apps/gui/src-tauri/tauri.conf.json';
            if (fs.existsSync(tauriPath)) {
              const tauriConf = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
              tauriConf.version = process.env.RAW_VERSION;
              fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2) + '\n');
            }

            // apps/gui/src-tauri/Cargo.toml
            const cargoTauriPath = 'apps/gui/src-tauri/Cargo.toml';
            if (fs.existsSync(cargoTauriPath)) {
              let cargoTauri = fs.readFileSync(cargoTauriPath, 'utf8');
              cargoTauri = cargoTauri.replace(/^version = \".*\"/m, 'version = \"' + process.env.RAW_VERSION + '\"');
              fs.writeFileSync(cargoTauriPath, cargoTauri);
            }

            // apps/cli/Cargo.toml
            const cargoCliPath = 'apps/cli/Cargo.toml';
            if (fs.existsSync(cargoCliPath)) {
              let cargoCli = fs.readFileSync(cargoCliPath, 'utf8');
              cargoCli = cargoCli.replace(/^version = \".*\"/m, 'version = \"' + process.env.RAW_VERSION + '\"');
              fs.writeFileSync(cargoCliPath, cargoCli);
            }
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'apps/gui/package-lock.json'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        working-directory: apps/gui
        run: npm ci

      - name: Build Standalone Desktop GUI App
        working-directory: apps/gui
        run: |
          npm run build
          npx tauri build --no-bundle ${{ matrix.args }}

      - name: Build Standalone CLI Binary
        run: cargo build --release --bin factorio-mod-downloader-cli ${{ matrix.args }}

      - name: Stage Release Executables
        shell: bash
        run: |
          mkdir -p release_assets
          TARGET_DIR="target/release"
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            TARGET_DIR="target/universal-apple-darwin/release"
          fi

          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp "${TARGET_DIR}/app.exe" release_assets/factorio-mod-downloader-gui-windows-x64.exe
            cp "${TARGET_DIR}/factorio-mod-downloader-cli.exe" release_assets/factorio-mod-downloader-cli-windows-x64.exe
          elif [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cp "${TARGET_DIR}/app" release_assets/factorio-mod-downloader-gui-macos-universal
            cp "${TARGET_DIR}/factorio-mod-downloader-cli" release_assets/factorio-mod-downloader-cli-macos-universal
          else
            cp "${TARGET_DIR}/app" release_assets/factorio-mod-downloader-gui-linux-x64
            cp "${TARGET_DIR}/factorio-mod-downloader-cli" release_assets/factorio-mod-downloader-cli-linux-x64
          fi

      - name: Publish Direct Standalone Executables to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.target_version }}
          name: 'Factorio Mod Downloader ${{ needs.validate.outputs.target_version }}'
          body: |
            Release ${{ needs.validate.outputs.target_version }} containing direct standalone executables (no installation required).

            ## Direct Executables
            - **Windows**: `factorio-mod-downloader-gui-windows-x64.exe` (Standalone Executable)
            - **macOS**: `factorio-mod-downloader-gui-macos-universal` (Universal Standalone Binary)
            - **Linux**: `factorio-mod-downloader-gui-linux-x64` (Standalone ELF Binary)
            - **CLI**: Platform CLI standalone binaries included for automation
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
