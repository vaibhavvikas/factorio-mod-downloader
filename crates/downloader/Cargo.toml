[package]
name = "downloader"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
parser = { path = "../parser" }
factorio = { path = "../factorio" }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tokio = { version = "1.53.1", features = ["full", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = "0.10.2"
sha1 = "0.10.6"
futures-util = "0.3.31"