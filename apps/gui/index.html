<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factorio Mod Downloader</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html.dark, html.dark body {
        background-color: oklch(0.148 0.004 228.8);
        color: oklch(0.987 0.002 197.1);
      }
      html:not(.dark), html:not(.dark) body {
        background-color: oklch(1 0 0);
        color: oklch(0.148 0.004 228.8);
      }
    </style>
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('factorio-theme') || 'system';
          const isDark = stored === 'dark' || 
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
